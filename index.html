<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Марина</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fff5f0 0%, #ffe8e0 25%, #ffd6e8 50%, #ffe4c4 75%, #fff0f5 100%);
      background-attachment: fixed;
      color: #2d2d2d;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 32px rgba(255, 120, 80, 0.25);
      margin-bottom: 20px;
    }

    .name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #1a1a1a;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #555;
      max-width: 340px;
      margin: 0 auto 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #2d2d2d;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 100, 80, 0.18);
      background: rgba(255, 255, 255, 0.95);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-btn--telegram svg { color: #229ED9; }
    .link-btn--instagram svg { color: #E4405F; }
    .link-btn--youtube svg { color: #FF0000; }
    .link-btn--whatsapp svg { color: #25D366; }
    .link-btn--email svg { color: #EA4335; }

    @media (max-width: 380px) {
      .avatar {
        width: 100px;
        height: 100px;
      }

      .name {
        font-size: 1.65rem;
      }

      .bio {
        font-size: 0.875rem;
      }

      .link-btn {
        padding: 12px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="avatar cursor.JPG" alt="Марина">

    <h1 class="name">Марина</h1>

    <p class="bio">
      Инженер автоматизации / веб-разработчик / контент-заводы.<br>
      Помогаю бизнесу внедрять ии-агентов и оптимизировать процессы.
    </p>

    <nav class="links">

      </a>

      <a class="link-btn link-btn--email" href="mailto:marina@example.com" id="email-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Email
      </a>
    </nav>
  </main>

  <script>
    document.querySelectorAll('.link-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.style.transform = 'scale(0.97)';
        setTimeout(function () { btn.style.transform = ''; }, 150);
      });
    });

    var emailBtn = document.getElementById('email-btn');
    emailBtn.addEventListener('click', function (e) {
      if (navigator.clipboard) {
        var email = emailBtn.href.replace('mailto:', '');
        navigator.clipboard.writeText(email).catch(function () {});
      }
    });
  </script>
</body>
</html>
