<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Марина</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #0f0c29;
      --bg-2: #1a1a3e;
      --bg-3: #24243e;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f0f0f5;
      --text-muted: #a0a0b8;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .name {
      font-size: clamp(1.75rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .link-btn--telegram { border-color: rgba(42, 171, 238, 0.35); }
    .link-btn--telegram:hover { background: rgba(42, 171, 238, 0.15); }

    .link-btn--instagram { border-color: rgba(225, 48, 108, 0.35); }
    .link-btn--instagram:hover { background: rgba(225, 48, 108, 0.15); }

    .link-btn--youtube { border-color: rgba(255, 0, 0, 0.35); }
    .link-btn--youtube:hover { background: rgba(255, 0, 0, 0.15); }

    .link-btn--whatsapp { border-color: rgba(37, 211, 102, 0.35); }
    .link-btn--whatsapp:hover { background: rgba(37, 211, 102, 0.15); }

    .link-btn--email { border-color: rgba(160, 160, 184, 0.35); }
    .link-btn--email:hover { background: rgba(160, 160, 184, 0.15); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 20px;
      font-size: 0.875rem;
      color: var(--text);
      background: rgba(30, 30, 50, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 380px) {
      .card {
        padding: 32px 20px 28px;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="avatar%20cursor.JPG"
      alt="Марина"
      width="120"

    >

    <p class="bio">

      Помогаю бизнесу внедрять ИИ-агентов и оптимизировать процессы.
    </p>

      <a class="link-btn link-btn--email" href="mailto:hello@example.com" id="email-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Email
      </a>
    </nav>
  </main>

  <div class="toast" id="toast">Email скопирован</div>

  <script>
    const toast = document.getElementById('toast');
    const emailBtn = document.getElementById('email-btn');

    emailBtn.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && navigator.clipboard) {
        e.preventDefault();
        const email = emailBtn.getAttribute('href').replace('mailto:', '');
        navigator.clipboard.writeText(email).then(() => {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
      }
    });
  </script>
</body>
</html>
