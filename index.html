<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Марина — визитка</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e8 0%, #e8d4ff 35%, #ffe8cc 70%, #d4e8ff 100%);
      background-attachment: fixed;
      color: #1a1a2e;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px 36px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(120, 80, 160, 0.12);
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 4px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 20px rgba(180, 100, 180, 0.25);
      margin-bottom: 20px;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #1a1a2e;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #4a4a6a;
      margin-bottom: 28px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      border: 1px solid rgba(120, 100, 160, 0.14);
      border-radius: 12px;
      font-size: 0.925rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      color: #2d2d44;
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(120, 100, 160, 0.28);
      box-shadow: 0 2px 12px rgba(120, 80, 160, 0.1);
      color: #1a1a2e;
    }

    .link-btn:active {
      background: rgba(255, 255, 255, 0.75);
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover svg {
      opacity: 0.85;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.875rem;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 20px 28px;
        border-radius: 22px;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      .name {
        font-size: 1.5rem;
      }

      .bio {
        font-size: 0.9rem;
      }

      .link-btn {
        padding: 13px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="avatar.png"
      alt="Марина — фото профиля"
      width="120"
      height="120"
    >

    <h1 class="name">Марина</h1>

    <p class="bio">
      Веб-разработчик и инженер автоматизации.<br>
      Помогаю бизнесу внедрять ИИ-агентов и оптимизировать процессы.
    </p>

    <nav class="links">
      <a class="link-btn" href="https://t.me/marinaMKokay" target="_blank" rel="noopener noreferrer">

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

      </button>

      <button class="link-btn" id="emailBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Email
      </button>
    </nav>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const email = 'aimarina19985@gmail.com';
    const toast = document.getElementById('toast');

    document.getElementById('emailBtn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(email).then(() => showToast('Email скопирован: ' + email));
      } else {
        window.location.href = 'mailto:' + email;
      }
    });

    document.getElementById('whatsappBtn').addEventListener('click', () => {
      showToast('WhatsApp — скоро будет доступен');
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
